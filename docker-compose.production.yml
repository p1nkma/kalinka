name: kalinka

volumes:
  database-data:
    name: kalinka_database_data
  caddy_data:
    name: kalinka_caddy_data
  caddy_config:
    name: kalinka_caddy_config

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalinka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-kalinka}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  kalinka:
    image: kalinka:${KALINKA_TAG:-latest}
    init: true
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_WEBAPP_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      NEXTAUTH_URL: https://${DOMAIN}/api/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.production}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?Set CALENDSO_ENCRYPTION_KEY in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kalinka}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kalinka}
      DATABASE_HOST: database:5432
      CALCOM_TELEMETRY_DISABLED: "1"
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      kalinka:
        condition: service_healthy
